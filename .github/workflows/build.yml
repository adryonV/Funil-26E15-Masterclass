name: build-and-deploy

on:
  schedule:
    - cron: "7 */2 * * *"          # a cada 2h (backup; o gatilho principal é o cron-job.org)
  workflow_dispatch:               # botão manual
  repository_dispatch:             # disparado pelo cron-job.org
    types: [rebuild]
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build data.json (cruza as 2 planilhas)
        run: node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
